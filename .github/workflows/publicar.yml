# A cada envio para a branch main: gera a versão nova e publica no GitHub Pages
# (app web + atualizacoes/latest.json + o pacote que o app Android baixa sozinho).
name: Publicar atualização

on:
  push:
    branches: [main]
    paths: ["www/**", "tools/build.py", "neru.config.json", ".github/workflows/publicar.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar versão
        run: python3 tools/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deploy
        uses: actions/deploy-pages@v4
