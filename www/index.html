<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#241A22">
<meta name="description" content="Diário de calorias, proteína e treino com registro por texto, foto e áudio.">
<title>Neru Calorias</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonte.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="atualizacao" hidden></button>
<header id="topo"></header>
<main id="tela"></main>

<nav id="abas" aria-label="Seções">
  <button data-acao="aba" data-aba="hoje"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></span>Diário</button>
  <button data-acao="aba" data-aba="treino" data-treino="inicio"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg></span>Treino</button>
  <button data-acao="aba" data-aba="perfil"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>Perfil</button>
  <button data-acao="aba" data-aba="equipe"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>Registro</button>
  <button data-acao="aba" data-aba="ia"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg></span>IA</button>
</nav>

<div id="folha" hidden>
  <div class="fundo" data-acao="fechar-folha"></div>
  <div class="painel" role="dialog" aria-modal="true" aria-labelledby="folha-titulo">
    <button class="fechar" data-acao="fechar-folha" aria-label="Fechar">×</button>
    <div id="folha-corpo"></div>
  </div>
</div>

<div id="descanso" role="timer" aria-live="off" hidden></div>
<div id="aviso" role="status" aria-live="polite"></div>

<noscript><p style="padding:24px">O Neru Calorias precisa de JavaScript para funcionar.</p></noscript>
<script src="version.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
